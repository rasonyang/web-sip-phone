name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the zip to (for example v1.0.8)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never interpolate this into a run script directly; reference $TAG.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify tag matches manifest version
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('static/manifest.json', 'utf8')).version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag '$TAG' does not match static/manifest.json version '$version'."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm test

      - run: npm run gen-icons && npm run build && npm run package

      - name: Name the zip after the manifest version
        run: |
          # scripts/package.mjs names the zip after package.json's version.
          zip_name="web-sip-phone-${VERSION}.zip"
          if [ ! -f "$zip_name" ]; then
            set -- web-sip-phone-*.zip
            mv "$1" "$zip_name"
          fi
          unzip -l "$zip_name"

      - uses: actions/upload-artifact@v4
        with:
          name: web-sip-phone-${{ env.VERSION }}
          path: web-sip-phone-${{ env.VERSION }}.zip
          if-no-files-found: error

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "web-sip-phone-${VERSION}.zip" --clobber
